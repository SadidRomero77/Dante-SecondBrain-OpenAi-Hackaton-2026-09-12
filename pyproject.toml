[project]
name = "dante"
version = "0.1.0"
description = "Segundo cerebro con voz, memoria y cara de perro"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "websockets>=13",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    # Windows no trae la base de zonas horarias IANA; zoneinfo la necesita.
    "tzdata>=2024.1",
    # Vision: opencv-contrib trae el reconocedor de rostros LBPH, que el
    # opencv normal no incluye.
    "opencv-contrib-python>=4.10",
    "pillow>=10.0",
    # Panel del cuidador
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
dante = "dante.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dante"]
